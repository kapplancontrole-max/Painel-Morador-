<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Morador - AbrangeBox</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f1f5f9; display: flex; height: 100vh; justify-content: center; align-items: center; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 380px; border: 1px solid #e2e8f0; }
        
        .logo-wrapper { text-align: center; margin-bottom: 25px; }
        .logo-wrapper img { width: 100%; max-width: 550px; height: auto; }

        label { font-weight: 600; display: block; margin-top: 15px; color: #1e293b; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-top: 6px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background-color: #f8fafc; transition: border 0.2s; }
        input:focus { border-color: #3b82f6; outline: none; background-color: white; }
        button { background-color: #3b82f6; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin-top: 25px; width: 100%; font-size: 16px; font-weight: bold; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2); }
        button:hover { background-color: #2563eb; }
        
        .mensagem { font-size: 13px; text-align: center; margin-top: 15px; font-weight: 600; display: none; }
        .mensagem-erro { color: #ef4444; }
        .mensagem-sucesso { color: #10b981; }

        .link-toggle { margin-top: 20px; text-align: center; font-size: 14px; color: #3b82f6; cursor: pointer; display: block; text-decoration: underline; }
        .link-toggle:hover { color: #1d4ed8; }
        
        .escondido { display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-wrapper">
        <img src="logo.png" alt="Logo AbrangeBox">
    </div>
    
    <!-- FORMULÁRIO DE LOGIN -->
    <form id="formLogin" onsubmit="efetuarLogin(event)">
        <label>ID de Acesso da Vaga:</label>
        <input type="text" id="id_hardware" placeholder="Ex: ap01 ou 01" required>
        
        <label>Senha:</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
        
        <div id="msgLogin" class="mensagem mensagem-erro"></div>

        <button type="submit" id="btnEntrar">Entrar no Meu Painel</button>
        <span class="link-toggle" onclick="alternarTelas('cadastro')">Primeiro acesso? Cadastrar senha</span>
    </form>

    <!-- FORMULÁRIO DE CRIAÇÃO DE SENHA -->
    <form id="formCadastro" class="escondido" onsubmit="cadastrarSenha(event)">
        <label>ID de Acesso da Vaga:</label>
        <input type="text" id="cad_id_hardware" placeholder="Ex: ap01 ou 01" required>
        
        <label>Nova Senha:</label>
        <input type="password" id="cad_senha" placeholder="Crie uma senha" required minlength="4">

        <label>Confirme a Nova Senha:</label>
        <input type="password" id="cad_confirma_senha" placeholder="Repita a senha" required minlength="4">
        
        <div id="msgCadastro" class="mensagem"></div>

        <button type="submit" id="btnCadastrar">Cadastrar Senha</button>
        <span class="link-toggle" onclick="alternarTelas('login')">Voltar para o Login</span>
    </form>
</div>

<script>
    const urlGAS = "https://script.google.com/macros/s/AKfycbw4WG8kjvhsYHwn0lKd59q8kMonyKltpFw5AmvCgWC2OAFvST7RKq2M9OkycFdw2LmP/exec";

    function alternarTelas(tela) {
        document.getElementById('msgLogin').style.display = 'none';
        document.getElementById('msgCadastro').style.display = 'none';
        
        if (tela === 'cadastro') {
            document.getElementById('formLogin').classList.add('escondido');
            document.getElementById('formCadastro').classList.remove('escondido');
        } else {
            document.getElementById('formCadastro').classList.add('escondido');
            document.getElementById('formLogin').classList.remove('escondido');
        }
    }

    async function efetuarLogin(event) {
        event.preventDefault(); 
        const txtVaga = document.getElementById('id_hardware').value.trim();
        const txtSenha = document.getElementById('senha').value.trim();
        const btn = document.getElementById('btnEntrar');
        const msgBox = document.getElementById('msgLogin');

        btn.innerText = "Verificando...";
        btn.style.backgroundColor = "#94a3b8";
        btn.disabled = true;
        msgBox.style.display = "none";

        try {
            const resposta = await fetch(urlGAS, {
                method: 'POST',
                body: JSON.stringify({ vaga: txtVaga, senha: txtSenha, acao: "verificar_login" })
            });
            
            const resultado = await resposta.json();

            if (resultado.status === "sucesso") {
                sessionStorage.setItem('vagaLogada', txtVaga);
                sessionStorage.setItem('senhaLogada', txtSenha);
                window.location.href = "dashboard.html";
            } else {
                msgBox.className = "mensagem mensagem-erro";
                msgBox.innerText = resultado.mensagem || "Vaga ou senha incorreta!";
                msgBox.style.display = "block";
                resetBotao(btn, "Entrar no Meu Painel");
            }
        } catch (error) {
            msgBox.className = "mensagem mensagem-erro";
            msgBox.innerText = "Erro de conexão com o servidor.";
            msgBox.style.display = "block";
            resetBotao(btn, "Entrar no Meu Painel");
        }
    }

    async function cadastrarSenha(event) {
        event.preventDefault();
        const txtVaga = document.getElementById('cad_id_hardware').value.trim();
        const txtSenha = document.getElementById('cad_senha').value.trim();
        const txtConfirma = document.getElementById('cad_confirma_senha').value.trim();
        const btn = document.getElementById('btnCadastrar');
        const msgBox = document.getElementById('msgCadastro');

        if (txtSenha !== txtConfirma) {
            msgBox.className = "mensagem mensagem-erro";
            msgBox.innerText = "As senhas não coincidem!";
            msgBox.style.display = "block";
            return;
        }

        btn.innerText = "Salvando...";
        btn.style.backgroundColor = "#94a3b8";
        btn.disabled = true;
        msgBox.style.display = "none";

        try {
            const resposta = await fetch(urlGAS, {
                method: 'POST',
                body: JSON.stringify({ vaga: txtVaga, novaSenha: txtSenha, acao: "criar_senha" })
            });

            const resultado = await resposta.json();

            if (resultado.status === "sucesso") {
                msgBox.className = "mensagem mensagem-sucesso";
                msgBox.innerText = resultado.mensagem || "Senha cadastrada com sucesso!";
                msgBox.style.display = "block";
                
                setTimeout(() => {
                    alternarTelas('login');
                    document.getElementById('id_hardware').value = txtVaga;
                    resetBotao(btn, "Cadastrar Senha");
                }, 2000);
            } else {
                msgBox.className = "mensagem mensagem-erro";
                msgBox.innerText = resultado.mensagem || "Erro ao cadastrar senha.";
                msgBox.style.display = "block";
                resetBotao(btn, "Cadastrar Senha");
            }
        } catch (error) {
            msgBox.className = "mensagem mensagem-erro";
            msgBox.innerText = "Erro ao se comunicar com o servidor.";
            msgBox.style.display = "block";
            resetBotao(btn, "Cadastrar Senha");
        }
    }

    function resetBotao(btn, textoOriginal) {
        btn.innerText = textoOriginal;
        btn.style.backgroundColor = "#3b82f6";
        btn.disabled = false;
    }
</script>

</body>
</html>
