<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar / Alterar Senha</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:disabled { background-color: #6c757d; cursor: not-allowed; }
    #mensagem { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; text-align: center; }
    .sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <h2>Cadastrar Senha</h2>
  
  <form id="formCadastro">
    <div class="form-group">
      <label for="vaga">Nº da Vaga / Apartamento:</label>
      <input type="text" id="vaga" placeholder="Ex: 101" required>
    </div>

    <div class="form-group">
      <label for="senha">Nova Senha:</label>
      <input type="password" id="senha" placeholder="Digite sua senha" required>
    </div>

    <button type="submit" id="btnSalvar">Salvar Senha</button>
  </form>

  <div id="mensagem"></div>

  <script>
    // ⚠️ SUBSTITUA PELA SUA URL DO WEB APP PUBLICADO
    const API_URL = "https://script.google.com/macros/s/AKfycbw4WG8kjvhsYHwn0lKd59q8kMonyKltpFw5AmvCgWC2OAFvST7RKq2M9OkycFdw2LmP/exec";

    const form = document.getElementById("formCadastro");
    const btnSalvar = document.getElementById("btnSalvar");
    const divMensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const vaga = document.getElementById("vaga").value.trim();
      const senha = document.getElementById("senha").value.trim();

      if (!vaga || !senha) {
        exibirMensagem("Preencha todos os campos!", "erro");
        return;
      }

      btnSalvar.disabled = true;
      btnSalvar.innerText = "Gravando na planilha...";
      divMensagem.style.display = "none";

      try {
        // Envio via POST tratando o protocolo do Google Apps Script
        const resposta = await fetch(API_URL, {
          method: "POST",
          // IMPORTANTE: Use text/plain para impedir o Google de descartar o body JSON
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            acao: "cadastrar",
            vaga: vaga,
            senha: senha
          })
        });

        const dados = await resposta.json();

        if (dados.status === "sucesso") {
          exibirMensagem("✅ Senha cadastrada com sucesso! Agora você já pode fazer login.", "sucesso");
          form.reset();
        } else {
          exibirMensagem("❌ Erro: " + dados.mensagem, "erro");
        }
      } catch (erro) {
        console.error("Erro ao conectar com a API:", erro);
        exibirMensagem("❌ Falha na conexão com o servidor. Verifique a URL do script.", "erro");
      } finally {
        btnSalvar.disabled = false;
        btnSalvar.innerText = "Salvar Senha";
      }
    });

    function exibirMensagem(texto, tipo) {
      divMensagem.className = tipo;
      divMensagem.innerText = texto;
      divMensagem.style.display = "block";
    }
  </script>
</body>
</html>
