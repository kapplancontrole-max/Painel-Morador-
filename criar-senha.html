<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro Acesso - AbrangeBox</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f1f5f9; display: flex; height: 100vh; justify-content: center; align-items: center; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 380px; border: 1px solid #e2e8f0; }
        .logo-wrapper { text-align: center; margin-bottom: 25px; }
        .logo-wrapper img { width: 100%; max-width: 180px; height: auto; }
        h2 { margin: 0 0 10px 0; font-size: 20px; color: #0f172a; text-align: center; }
        p { font-size: 13px; color: #64748b; text-align: center; margin: 0 0 20px 0; }
        label { font-weight: 600; display: block; margin-top: 15px; color: #1e293b; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-top: 6px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background-color: #f8fafc; }
        button { background-color: #10b981; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; width: 100%; font-size: 16px; font-weight: bold; }
        .btn-secundario { background-color: transparent; color: #64748b; border: 1px solid #cbd5e1; margin-top: 10px; }
        .mensagem { font-size: 13px; text-align: center; margin-top: 15px; display: none; font-weight: 600; }
        .erro { color: #ef4444; }
        .sucesso { color: #10b981; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-wrapper">
        <img src="logo.png" alt="Logo AbrangeBox">
    </div>

    <h2>Primeiro Acesso</h2>
    <p>Cadastre uma senha para o seu ID pré-registrado.</p>
    
    <form id="formCadastro" onsubmit="cadastrarSenha(event)">
        <label>ID de Acesso da Vaga:</label>
        <input type="text" id="id_hardware" placeholder="Ex: ap01 ou 01" required>
        
        <label>Crie sua Senha:</label>
        <input type="password" id="nova_senha" placeholder="Digite a nova senha" required>
        
        <div id="mensagemBox" class="mensagem"></div>

        <button type="submit" id="btnSalvar">Cadastrar Senha</button>
        <button type="button" class="btn-secundario" onclick="window.location.href='login.html'">Voltar ao Login</button>
    </form>
</div>

<script>
    async function cadastrarSenha(event) {
        event.preventDefault(); 
        
        const txtVaga = document.getElementById('id_hardware').value.trim();
        const txtSenha = document.getElementById('nova_senha').value.trim();
        const btn = document.getElementById('btnSalvar');
        const msgBox = document.getElementById('mensagemBox');

        const urlGAS = "https://script.google.com/macros/s/AKfycbw4WG8kjvhsYHwn0lKd59q8kMonyKltpFw5AmvCgWC2OAFvST7RKq2M9OkycFdw2LmP/exec";

        btn.innerText = "Validando ID...";
        btn.style.backgroundColor = "#94a3b8";
        btn.disabled = true;
        msgBox.style.display = "none";

        try {
            const urlCompleta = `${urlGAS}?acao=cadastrar&vaga=${encodeURIComponent(txtVaga)}&senha=${encodeURIComponent(txtSenha)}`;

            // Tenta a requisição padrão
            const resposta = await fetch(urlCompleta);
            const resultado = await resposta.json();

            if (resultado.status === "sucesso") {
                exibirSucesso();
            } else {
                msgBox.className = "mensagem erro";
                msgBox.innerText = resultado.mensagem || "ID não encontrado na base de dados!";
                msgBox.style.display = "block";
                resetBotao();
            }
        } catch (error) {
            // Fallback caso o navegador bloqueie a leitura do JSON por CORS/Redirecionamento
            try {
                const urlCompleta = `${urlGAS}?acao=cadastrar&vaga=${encodeURIComponent(txtVaga)}&senha=${encodeURIComponent(txtSenha)}`;
                await fetch(urlCompleta, { mode: 'no-cors' });
                
                // Em modo no-cors a requisição é entregue ao Google Apps Script
                exibirSucesso();
            } catch (err) {
                msgBox.className = "mensagem erro";
                msgBox.innerText = "Falha ao enviar os dados. Verifique sua conexão.";
                msgBox.style.display = "block";
                resetBotao();
            }
        }
    }

    function exibirSucesso() {
        const msgBox = document.getElementById('mensagemBox');
        msgBox.className = "mensagem sucesso";
        msgBox.innerText = "Solicitação enviada com sucesso! Redirecionando...";
        msgBox.style.display = "block";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 2000);
    }

    function resetBotao() {
        const btn = document.getElementById('btnSalvar');
        btn.innerText = "Cadastrar Senha";
        btn.style.backgroundColor = "#10b981";
        btn.disabled = false;
    }
</script>

</body>
</html>
